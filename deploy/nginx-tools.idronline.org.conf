# nginx site for tools.idronline.org (Translate, Audio, Email Collector, Image Search).
# Install:  sudo cp deploy/nginx-tools.idronline.org.conf /etc/nginx/sites-available/tools.idronline.org
#           sudo ln -s /etc/nginx/sites-available/tools.idronline.org /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d tools.idronline.org --redirect   # adds HTTPS (port 443) + http->https
# The apps listen on 127.0.0.1 only (BIND_HOST / --host 127.0.0.1); nginx is the only way in.
# Image Search stays on the image server; /image-search/ is only passed on to api.idronline.org so all
# four tools share one address and one sign-in (needs the same SECRET_KEY / APP_* on both servers).

server {
    listen 80;
    server_name tools.idronline.org;

    client_max_body_size 200M;      # email zips can be big
    proxy_read_timeout 900s;        # long audio / translations
    proxy_send_timeout 900s;

    location = / { return 302 /translate/; }

    location /translate/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /translate;
    }

    location /audio/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /audio;
    }

    location /emails/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /emails;
    }

    location /image-search/ {
        proxy_pass https://api.idronline.org/image-search/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.idronline.org;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }
}
