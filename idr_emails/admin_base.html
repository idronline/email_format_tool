<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">
    <title>Admin · IDR Tools</title>
    <link rel="icon" href="https://idronline.org/wp-content/uploads/2018/07/Untitled-design-300x300-1-150x150.jpg" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="static/idr-tools.css">
    <style>
      /* Admin only. Series colours: fixed categorical order, one per tool. */
      :root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#8a5cd1;--ink-2:#52514e;--rule:#dcdcdc}
      main.admin{max-width:1040px}
      .hero .idr-wrap.admin{max-width:1040px}
      .tabs{display:flex;gap:.25rem;margin-top:1.1rem;border-bottom:1.5px solid rgba(255,255,255,.6)}
      .tabs a{color:var(--white);text-decoration:none;font-weight:700;padding:.4rem 1.1rem;border-radius:8px 8px 0 0}
      .tabs a.on{background:var(--white);color:var(--red)}
      .period{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}
      .period a{color:var(--white);text-decoration:none;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;
                padding:.2rem .8rem;font-size:.85rem;font-weight:600}
      .period a.on{background:var(--white);color:var(--red);border-color:var(--white)}
      .period a.lock{margin-left:auto;border-color:transparent;font-weight:400}
      h2.section{font-size:1.15rem;margin:2rem 0 .8rem;padding-bottom:.4rem;border-bottom:1px solid var(--black)}
      .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
      .tile{background:var(--light-grey);border-radius:12px;padding:1rem 1.1rem}
      .tile .name{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.92rem}
      .sw{width:.75rem;height:.75rem;border-radius:3px;flex:none;display:inline-block}
      .sw.s1{background:var(--s1)}.sw.s2{background:var(--s2)}.sw.s3{background:var(--s3)}.sw.s4{background:var(--s4)}.sw.s5{background:var(--s5)}
      .tile .big{font-size:2.2rem;font-weight:700;line-height:1.1;margin:.35rem 0 .15rem}
      .tile .sub{font-size:.82rem;color:var(--ink-2)}
      .bad{color:var(--red);font-weight:600}
      /* stacked bar chart */
      .chart-card{background:var(--light-grey);border-radius:12px;padding:1rem 1.1rem}
      .legend{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;font-size:.85rem;margin-bottom:.7rem}
      .legend span{display:inline-flex;align-items:center;gap:.4rem}
      .plot{position:relative;height:200px;margin-left:2.2rem;border-bottom:1px solid #b5b5b5}
      .gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
      .gridline span{position:absolute;left:-2.2rem;top:-.6rem;width:1.9rem;text-align:right;font-size:.72rem;color:var(--ink-2)}
      .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
      .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default;min-width:0}
      .col:hover{background:rgba(0,0,0,.04)}
      .stack{width:min(80%,22px);display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden}
      .seg.s1{background:var(--s1)}.seg.s2{background:var(--s2)}.seg.s3{background:var(--s3)}.seg.s4{background:var(--s4)}.seg.s5{background:var(--s5)}
      .xaxis{display:flex;justify-content:space-between;margin-left:2.2rem;font-size:.72rem;color:var(--ink-2);margin-top:.3rem}
      .tip{position:fixed;pointer-events:none;background:var(--black);color:var(--white);font-size:.8rem;border-radius:8px;
           padding:.45rem .65rem;line-height:1.4;z-index:10;display:none;white-space:nowrap}
      .tip .sw{margin-right:.35rem;box-shadow:0 0 0 1.5px var(--black)}
      details.table-view{margin-top:.8rem}
      /* tables */
      table.t{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--white)}
      table.t th,table.t td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--light-grey);vertical-align:top}
      table.t th{font-size:.78rem;color:var(--ink-2);font-weight:600}
      table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
      table.t th.n{text-align:right}
      .box{background:var(--light-grey);border-radius:12px;padding:1rem 1.1rem}
      .box h3{font-size:.95rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.45rem}
      .kv{display:flex;justify-content:space-between;font-size:.88rem;padding:.25rem 0;border-bottom:1px solid var(--white)}
      .kv b{font-variant-numeric:tabular-nums}
      .muted{color:var(--ink-2);font-size:.82rem}
      .pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:.05rem .5rem}
      .pill.up{background:var(--pale-green);color:#127a54}.pill.down{background:var(--pale-red);color:#a8221f}
      .pill.warn{background:var(--pale-yellow);color:#7a5a00}
      .scroll{overflow-x:auto}
    </style>
  </head>
  <body>
    {{ nav|safe }}
    <header class="hero"><div class="idr-wrap admin">
      <h1>Admin</h1>
      <p class="lead">{% block lead %}{% endblock %}</p>
      <nav class="tabs" aria-label="Admin sections">
        <a href="./?days={{ days }}"{% if tab == 'tools' %} class="on" aria-current="page"{% endif %}>Tools</a>
        <a href="search?days={{ days }}"{% if tab == 'search' %} class="on" aria-current="page"{% endif %}>Search</a>
      </nav>
      <nav class="period" aria-label="Period">
        {% for p in periods %}<a href="?days={{ p }}"{% if p == days %} class="on" aria-current="page"{% endif %}>Last {{ p }} days</a>{% endfor %}
        <a class="lock" href="lock">Lock admin</a>
      </nav>
    </div></header>
    <main class="admin">
{% block content %}{% endblock %}
    </main>
    <footer>IDR internal tools &middot; admin</footer>
    <script>
    // Hover a day to see its numbers.
    (function () {
      var tip = document.getElementById('tip');
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
      document.querySelectorAll('.col').forEach(function (col) {
        col.addEventListener('mousemove', function (ev) {
          var names = JSON.parse(col.dataset.parts), counts = JSON.parse(col.dataset.counts), slots = JSON.parse(col.dataset.slots);
          var rows = names.map(function (n, i) { return '<div><i class="sw s' + slots[i] + '"></i>' + esc(n) + ': <b>' + counts[i] + '</b></div>'; });
          tip.innerHTML = '<b>' + esc(col.dataset.label) + '</b> &middot; ' + col.dataset.total + ' ' + esc(col.dataset.unit || 'uses') + rows.join('');
          tip.style.display = 'block';
          var x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
          tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
        });
        col.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
      });
    })();
    </script>
  </body>
</html>
