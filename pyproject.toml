[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idr-emails"
version = "0.2.0"
description = "Collect emails and names from a zip of messy files into one subscriber CSV."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
collect-emails = "idr_emails.cli:main"

[tool.setuptools]
packages = ["idr_emails"]

[tool.setuptools.package-data]
idr_emails = ["page.html", "nav.html", "login.html", "admin.html", "admin_unlock.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
